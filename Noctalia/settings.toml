qconfig_version = 11

[bar.default]
background_opacity = 0.44999998994171619
capsule_thickness = 0.64999998919665813
center = [ "workspaces" ]
concave_edge_corners = false
end = [ "media", "tray", "notifications", "clipboard", "volume", "control-center", "session" ]
font_weight = 700
margin_ends = 0
radius = 0
radius_top_left = 0
radius_top_right = 0
scale = 0.7500000037252903
shadow = false
start = [ "launcher", "clock", "cpu" ]
thickness = 16

[control_center]
hidden_tabs = [ "monitor", "power", "bluetooth", "weather", "notifications", "screen-time" ]
width = 850

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "media"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_opacity = 0.30999999307096004
background_opacity = 0.29999999329447746
icon_size = 36
inactive_opacity = 0.29999999329447746

[location]
address = "Bastos, São Paulo, Brasil"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@VGA-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@VGA-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "VGA-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@VGA-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.99999997764825821
collapse_on_dismiss = false
enable_daemon = false
show_actions = false

[osd]
enabled = false

[shell]
avatar_path = "/home/tipim/Downloads/miyabi.png"
card_borders = false
corner_radius_scale = 2.0
font_family = "Cantarell"
input_borders = false
lang = "pt-BR"
popup_borders = false
popup_shadows = false

    [shell.animation]
    speed = 1.1000000163912773

    [shell.launcher]
    categories = false

        [shell.launcher.providers.calculator]
        global = true

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.session]
        global = false

        [shell.launcher.providers.wallpaper]
        global = false

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "top_center"
    launcher_position = "bottom_center"
    session_placement = "floating"
    session_position = "center_right"
    transparency_mode = "glass"

    [shell.screen_corners]
    size = 29

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "ghost"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "ghost"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "ghost"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "ghost"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "ghost"

    [shell.shadow]
    alpha = 0.34999999217689037
    direction = "center"

[theme]
community_palette = "Mine"
custom_palette = "tifa-mc"
mode = "dark"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "kitty" ]

[wallpaper]
directory = "/home/tipim/Imagens"
directory_dark = "/home/tipim/Imagens"
transition = [ "disc" ]

    [wallpaper.default]
    path = "/home/tipim/Imagens/output.jpg"

    [wallpaper.last]
    path = "/home/tipim/Imagens/output.jpg"

    [wallpaper.monitors.VGA-1]
    path = "/home/tipim/Imagens/output.jpg"

    [[wallpaper.favorite]]
    path = "/home/tipim/Imagens/Coffe.png"
    theme_mode = "auto"

    [[wallpaper.favorite]]
    path = "/home/tipim/Imagens/Doom.jpeg"
    theme_mode = "auto"

[widget.clipboard]
enabled = false

[widget.media]
album_art_only = true

[widget.wallpaper]
enabled = false

[widget.workspaces]
pill_scale = 0.75
